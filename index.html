<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafis 3D - Скульптинг</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5ead6;
            color: #3a3020;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }
        #app { display: flex; height: 100vh; }

        #sidebar {
            width: 165px;
            background: linear-gradient(180deg, #f5ead6 0%, #ede0c8 100%);
            padding: 8px 6px;
            border-right: 2px solid #c9a961;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
            box-shadow: 2px 0 8px rgba(180, 150, 80, 0.15);
        }
        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-thumb { background: #c9a96199; border-radius: 2px; }

        #sidebar h2 {
            font-size: 13px;
            margin-bottom: 6px;
            padding-bottom: 5px;
            color: #8a6d1f;
            border-bottom: 2px solid #c9a961;
            text-align: center;
            letter-spacing: 0.5px;
            font-weight: 800;
        }

        .group {
            background: rgba(255, 255, 255, 0.55);
            border-radius: 4px;
            padding: 4px 5px;
            margin-bottom: 4px;
            border: 1px solid #c9a96144;
        }
        .group-title {
            font-size: 8px;
            font-weight: 800;
            color: #8a6d1f;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 4px 3px;
            margin: 1.5px 0;
            background: linear-gradient(180deg, #ffffff 0%, #f0e6d0 100%);
            color: #4a3a1a;
            border: 1px solid #c9a961;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            transition: all 0.12s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }
        button:hover {
            background: linear-gradient(180deg, #fff8e0 0%, #e8d8a8 100%);
            border-color: #a88a3d;
            box-shadow: 0 1px 4px rgba(200, 160, 60, 0.3);
        }
        button:active { transform: scale(0.97); }

        button.primary {
            background: linear-gradient(180deg, #e8c874 0%, #c9a961 100%);
            color: #3a2a0a;
            border-color: #a88a3d;
            font-weight: 800;
        }

        button.mode-btn {
            background: linear-gradient(180deg, #ffffff 0%, #f0e6d0 100%);
        }
        button.mode-btn.active {
            background: linear-gradient(180deg, #7ec87e 0%, #4a9a4a 100%);
            color: #ffffff;
            border-color: #3a7a3a;
            box-shadow: 0 0 10px rgba(74, 154, 74, 0.5);
            font-weight: 800;
        }

        button.success {
            background: linear-gradient(180deg, #a8d4a8 0%, #7eb87e 100%);
            color: #1a3a1a;
            border-color: #5a9a5a;
        }

        button.danger {
            background: linear-gradient(180deg, #e8b8b8 0%, #d49898 100%);
            color: #4a1a1a;
            border-color: #b87878;
        }

        button.warning {
            background: linear-gradient(180deg, #e8d498 0%, #d4c078 100%);
            color: #4a3a10;
            border-color: #b8a058;
        }

        button.new-model {
            background: linear-gradient(180deg, #d8c8e8 0%, #c0a8d4 100%);
            color: #3a1a4a;
            border-color: #a888b8;
        }

        button.undo-btn {
            background: linear-gradient(180deg, #b8d0e8 0%, #98b4d4 100%);
            color: #1a2a4a;
            border-color: #7898b8;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 1px 0;
            cursor: pointer;
            font-size: 10px;
            color: #4a3a1a;
            font-weight: 600;
        }
        .checkbox-label input[type="checkbox"] {
            width: 11px;
            height: 11px;
            cursor: pointer;
            accent-color: #c9a961;
        }

        #canvas-container {
            flex: 1;
            height: 100vh;
            background: radial-gradient(circle at 50% 40%, #f0e4cc 0%, #e0d0b0 60%, #d4c8a8 100%);
            position: relative;
            cursor: grab;
        }

        #info-panel {
            width: 200px;
            background: linear-gradient(180deg, #f5ead6 0%, #ede0c8 100%);
            padding: 8px;
            border-left: 2px solid #c9a961;
            flex-shrink: 0;
            overflow-y: auto;
            box-shadow: -2px 0 8px rgba(180, 150, 80, 0.15);
        }
        #info-panel::-webkit-scrollbar { width: 4px; }
        #info-panel::-webkit-scrollbar-thumb { background: #c9a96199; border-radius: 2px; }

        .info-item {
            padding: 2px 0;
            font-size: 10px;
            border-bottom: 1px solid #c9a96122;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-item .label {
            color: #8a6d1f;
            font-size: 8px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .info-item .value {
            color: #3a3020;
            font-weight: 800;
            font-size: 10px;
            text-align: right;
        }
        .info-item .value.gold { color: #a88a3d; }
        .info-item .value.silver { color: #888; }
        .info-item .value.green { color: #4a8a4a; }
        .info-item .value.red { color: #a84a4a; }

        .selected-count {
            font-size: 22px;
            font-weight: 800;
            color: #a88a3d;
            text-align: center;
            padding: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            border: 1px solid #c9a961;
            margin: 3px 0;
            text-shadow: 0 0 8px #d4af3766;
        }

        .status {
            padding: 5px 6px;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 10px;
            text-align: center;
            font-weight: 700;
            border: 1px solid;
        }
        .status.success { background: #d4e8c8; color: #2a5a2a; border-color: #7eb87e; }
        .status.warning { background: #f0e4b8; color: #6a5a10; border-color: #c9a961; }
        .status.error { background: #f0d0d0; color: #6a1a1a; border-color: #d49898; }
        .status.info { background: #d4dce8; color: #1a2a5a; border-color: #98b4d4; }

        #file-input, #mtl-input, #texture-input { display: none; }

        #log {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            padding: 4px;
            font-size: 8px;
            max-height: 70px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            color: #4a5a3a;
            margin-top: 3px;
            line-height: 1.3;
            border: 1px solid #c9a96144;
        }
        #log .error { color: #a84a4a; }
        #log .success { color: #3a7a3a; }
        #log .info { color: #4a6a9a; }
        #log .warn { color: #8a6a1a; }

        .brush-control {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 2px 0;
        }
        .brush-control input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            background: #d4c8a8;
            border-radius: 2px;
            outline: none;
        }
        .brush-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(180deg, #e8c874 0%, #a88a3d 100%);
            cursor: pointer;
        }
        .brush-control span {
            font-size: 9px;
            min-width: 24px;
            text-align: center;
            color: #8a6d1f;
            font-weight: 800;
        }

        .bvh-badge {
            padding: 3px;
            border-radius: 4px;
            font-size: 8px;
            text-align: center;
            margin-top: 2px;
            background: #d4e8c8;
            color: #2a5a2a;
            font-weight: 800;
            border: 1px solid #7eb87e;
        }

        .group-panel {
            background: rgba(255, 255, 255, 0.55);
            border-radius: 4px;
            padding: 6px;
            margin-bottom: 5px;
            border: 1px solid #c9a96144;
        }
        .group-panel-title {
            font-size: 9px;
            font-weight: 800;
            color: #8a6d1f;
            margin-bottom: 4px;
            text-align: center;
        }

        .mode-badge {
            padding: 4px;
            border-radius: 4px;
            font-size: 9px;
            text-align: center;
            margin-top: 3px;
            font-weight: 800;
            border: 1px solid;
        }
        .mode-badge.rotate { background: #d4e8c8; color: #2a5a2a; border-color: #7eb87e; }
        .mode-badge.select { background: #e8d4c8; color: #6a3a1a; border-color: #c89878; }
        .mode-badge.move { background: #d4dce8; color: #1a3a6a; border-color: #7898b8; }
    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <h2>🏥 Nafis 3D</h2>

        <div class="group">
            <div class="group-title">📂 Файл</div>
            <button class="primary" id="btn-load">📂 OBJ</button>
            <button id="btn-load-mtl">📄 MTL</button>
            <button id="btn-load-texture">🖼 Текстура</button>
            <button class="new-model" id="btn-new-model">🆕 Новая</button>
            <input type="file" id="file-input" accept=".obj">
            <input type="file" id="mtl-input" accept=".mtl">
            <input type="file" id="texture-input" accept="image/*">
        </div>

        <div class="group">
            <div class="group-title">🎮 Режим</div>
            <button class="mode-btn active" id="btn-mode-rotate">🖐 Вращать экран</button>
            <button class="mode-btn" id="btn-mode-move">✋ Двигать модель</button>
            <button class="mode-btn" id="btn-mode-select">🎯 Выделять</button>
            <div class="mode-badge rotate" id="mode-badge">🖐 Вращение экрана</div>
        </div>

        <div class="group">
            <div class="group-title">🎯 Выделение</div>
            <button id="btn-center">🎯 Центр</button>
            <button id="btn-top">⬆ Верх</button>
            <button id="btn-bottom">⬇ Низ</button>
            <button id="btn-random">🎲 Случ.</button>
            <button class="danger" id="btn-clear">🧹 Снять</button>
            <div class="brush-control">
                <span>🖌</span>
                <input type="range" id="brush-size" min="1" max="100" value="30">
                <span id="brush-label">0.30</span>
            </div>
        </div>

        <div class="group">
            <div class="group-title">🛠 Инструменты</div>
            <button class="success" id="btn-smooth">✨ Сгладить</button>
            <button id="btn-pull">⬆ Вытянуть</button>
            <button id="btn-push">⬇ Вдавить</button>
            <button id="btn-flatten">📏 Выровн.</button>
            <button class="warning" id="btn-inflate">💨 Надуть</button>
            <button id="btn-pinch">🤏 Сузить</button>
            <button class="undo-btn" id="btn-undo">↩️ Отменить</button>
        </div>

        <div class="group">
            <div class="group-title">👁 Отображение</div>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-wireframe"> Каркас
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-texture" checked> Текстура
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-highlight" checked> Подсветка
            </label>
        </div>

        <div class="bvh-badge" id="bvh-badge">⚡ Готов</div>

        <div id="log"></div>
    </div>

    <div id="canvas-container"></div>

    <div id="info-panel">
        <div class="group-panel">
            <div class="group-panel-title">📊 ИНФОРМАЦИЯ</div>
            <div class="info-item">
                <span class="label">Модель</span>
                <span class="value gold" id="info-name" style="font-size:9px; max-width:110px; overflow:hidden; text-overflow:ellipsis;">—</span>
            </div>
            <div class="info-item">
                <span class="label">Вершины</span>
                <span class="value silver" id="info-vertices">—</span>
            </div>
            <div class="info-item">
                <span class="label">Треуг.</span>
                <span class="value silver" id="info-faces">—</span>
            </div>
            <div class="info-item">
                <span class="label">Текстура</span>
                <span class="value red" id="info-texture">❌</span>
            </div>
            <div class="info-item">
                <span class="label">MTL</span>
                <span class="value red" id="info-mtl">❌</span>
            </div>
            <div class="info-item">
                <span class="label">Скорость</span>
                <span class="value green" id="info-speed">—</span>
            </div>
        </div>

        <div class="group-panel">
            <div class="group-panel-title">🎯 ВЫДЕЛЕНО</div>
            <div class="selected-count" id="info-selected">0</div>
        </div>

        <div class="group-panel">
            <div class="group-panel-title">⚙️ НАСТРОЙКИ</div>
            <div class="brush-control">
                <span>💪</span>
                <input type="range" id="smooth-strength" min="1" max="30" value="8">
                <span id="strength-label">0.08</span>
            </div>
            <div class="brush-control">
                <span>🔄</span>
                <input type="range" id="smooth-iterations" min="1" max="20" value="5">
                <span id="iterations-label">5</span>
            </div>
            <div class="brush-control">
                <span>🎯</span>
                <input type="range" id="smooth-falloff" min="1" max="10" value="5">
                <span id="falloff-label">5</span>
            </div>
        </div>

        <div class="group-panel">
            <div class="group-panel-title">📦 ЭКСПОРТ</div>
            <button id="btn-export">💾 Сохранить OBJ</button>
        </div>

        <div class="status success" id="info-status">✅ Готов</div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

// ============================================================
// ЛОГГЕР
// ============================================================

const logEl = document.getElementById('log');
function addLog(msg, type = 'info') {
    const div = document.createElement('div');
    div.className = type;
    div.textContent = msg;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ 3D
// ============================================================

const container = document.getElementById('canvas-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0e4cc);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 100);
camera.position.set(2.5, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.minDistance = 0.3;
controls.maxDistance = 20;
controls.enablePan = true;
controls.enableZoom = true;
controls.enableRotate = true;
controls.screenSpacePanning = true;

// ============================================================
// СВЕТ
// ============================================================

scene.add(new THREE.AmbientLight(0xf5ead6, 0.7));
const light1 = new THREE.DirectionalLight(0xfff8e0, 1.0);
light1.position.set(2, 3, 4);
scene.add(light1);
const light2 = new THREE.DirectionalLight(0xc9a961, 0.5);
light2.position.set(-2, -1, -3);
scene.add(light2);
const light3 = new THREE.DirectionalLight(0xa8b8d4, 0.4);
light3.position.set(0, -2, 1);
scene.add(light3);

// ============================================================
// СЕТКА
// ============================================================

const gridHelper = new THREE.GridHelper(3, 20, 0xc9a961, 0xb8a888);
gridHelper.position.y = -0.5;
scene.add(gridHelper);

// ============================================================
// ПЕРЕМЕННЫЕ
// ============================================================

let model = null;
let modelGroup = new THREE.Group();
scene.add(modelGroup);

let highlightMesh = null;
let highlightSphere = null;
let selectedIndices = [];
let isModelLoaded = false;

let objText = null;
let mtlText = null;
let textureImage = null;

let brushRadius = 0.3;
let showHighlight = true;

let smoothStrength = 0.08;
let smoothIterations = 5;
let smoothFalloff = 5;

let modelName = '';

let currentMode = 'rotate'; // 'rotate' | 'move' | 'select'

let historyStack = [];
const MAX_HISTORY = 20;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

// Для режима "двигать модель"
let isDraggingModel = false;
let dragPlane = new THREE.Plane();
let dragIntersection = new THREE.Vector3();
let dragStartPoint = new THREE.Vector3();
let dragStartModelPos = new THREE.Vector3();

// ============================================================
// ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ
// ============================================================

function setMode(mode) {
    currentMode = mode;

    const btnRotate = document.getElementById('btn-mode-rotate');
    const btnMove = document.getElementById('btn-mode-move');
    const btnSelect = document.getElementById('btn-mode-select');
    const badge = document.getElementById('mode-badge');

    btnRotate.classList.remove('active');
    btnMove.classList.remove('active');
    btnSelect.classList.remove('active');

    if (mode === 'rotate') {
        btnRotate.classList.add('active');
        badge.textContent = '🖐 Вращение экрана';
        badge.className = 'mode-badge rotate';
        controls.enabled = true;
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.PAN
        };
        document.getElementById('info-status').textContent = '🖐 Вращение экрана';
        document.getElementById('info-status').className = 'status success';
        addLog('🖐 Режим ВРАЩЕНИЯ', 'info');
    } else if (mode === 'move') {
        btnMove.classList.add('active');
        badge.textContent = '✋ Движение модели';
        badge.className = 'mode-badge move';
        controls.enabled = false;
        document.getElementById('info-status').textContent = '✋ Тяните модель (ЛКМ)';
        document.getElementById('info-status').className = 'status info';
        addLog('✋ Режим ДВИЖЕНИЯ модели', 'success');
    } else if (mode === 'select') {
        btnSelect.classList.add('active');
        badge.textContent = '🎯 Выделение';
        badge.className = 'mode-badge select';
        controls.enabled = true;
        controls.mouseButtons = {
            LEFT: null,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.PAN
        };
        document.getElementById('info-status').textContent = '🎯 Кликните по модели';
        document.getElementById('info-status').className = 'status info';
        addLog('🎯 Режим ВЫДЕЛЕНИЯ', 'success');
    }
}

// ============================================================
// КЛИК ПО МОДЕЛИ (режим выделения)
// ============================================================

renderer.domElement.addEventListener('click', function(event) {
    if (currentMode !== 'select') return;
    if (!model) { addLog('❌ Загрузите модель!', 'error'); return; }

    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObject(model, true);

    if (intersects.length > 0) {
        selectArea(intersects[0].point, brushRadius);
    } else {
        addLog('⚠️ Клик мимо модели', 'warn');
    }
});

// ============================================================
// ДВИЖЕНИЕ МОДЕЛИ (режим "move")
// ============================================================

renderer.domElement.addEventListener('mousedown', function(event) {
    if (currentMode !== 'move') return;
    if (event.button !== 0) return;
    if (!model) return;

    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObject(model, true);

    if (intersects.length > 0) {
        isDraggingModel = true;

        // Плоскость, перпендикулярная камере, через точку клика
        const normal = camera.getWorldDirection(new THREE.Vector3()).negate();
        dragPlane.setFromNormalAndCoplanarPoint(normal, intersects[0].point);

        dragStartPoint.copy(intersects[0].point);
        dragStartModelPos.copy(modelGroup.position);

        event.preventDefault();
    }
});

renderer.domElement.addEventListener('mousemove', function(event) {
    if (currentMode !== 'move') return;
    if (!isDraggingModel) return;

    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    raycaster.ray.intersectPlane(dragPlane, dragIntersection);

    if (dragIntersection) {
        const delta = dragIntersection.clone().sub(dragStartPoint);
        modelGroup.position.copy(dragStartModelPos).add(delta);
    }
});

renderer.domElement.addEventListener('mouseup', function() {
    isDraggingModel = false;
});

renderer.domElement.addEventListener('mouseleave', function() {
    isDraggingModel = false;
});

// ============================================================
// ЗАГРУЗКА МОДЕЛИ
// ============================================================

function loadModel() {
    if (!objText) {
        addLog('❌ Сначала загрузите OBJ!', 'error');
        return;
    }
    addLog('🔄 Загрузка...', 'info');
    try {
        while (modelGroup.children.length > 0) {
            const child = modelGroup.children[0];
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
            modelGroup.remove(child);
        }
        modelGroup.position.set(0, 0, 0);

        let materials = null;
        if (mtlText) {
            const mtlLoader = new MTLLoader();
            mtlLoader.parse(mtlText, '', (loadedMaterials) => {
                materials = loadedMaterials;
                document.getElementById('info-mtl').textContent = '✅';
                document.getElementById('info-mtl').className = 'value green';
                addLog('✅ MTL загружен', 'success');
                applyLoadedModel(materials);
            });
        } else {
            applyLoadedModel(null);
        }
    } catch (err) {
        addLog('❌ Ошибка: ' + err.message, 'error');
    }
}

function applyLoadedModel(materials) {
    try {
        const loader = new OBJLoader();
        if (materials) loader.setMaterials(materials);
        const obj = loader.parse(objText);
        if (!obj || obj.children.length === 0) {
            addLog('❌ Нет геометрии', 'error');
            return;
        }
        let meshCount = 0;
        obj.children.forEach(child => {
            if (child.isMesh) {
                meshCount++;
                if (textureImage && child.material) {
                    const texture = new THREE.Texture(textureImage);
                    texture.needsUpdate = true;
                    texture.colorSpace = THREE.SRGBColorSpace;
                    child.material.map = texture;
                    child.material.color.setHex(0xffffff);
                    child.material.needsUpdate = true;
                }
                modelGroup.add(child);
            }
        });
        if (meshCount === 0) {
            addLog('❌ Нет мешей', 'error');
            return;
        }

        // Центрируем детей
        const box = new THREE.Box3().setFromObject(modelGroup);
        const center = new THREE.Vector3();
        box.getCenter(center);
        modelGroup.children.forEach(child => {
            child.position.sub(center);
        });

        // Масштабируем
        const box2 = new THREE.Box3().setFromObject(modelGroup);
        const size = box2.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
            const scale = 1.8 / maxDim;
            modelGroup.children.forEach(child => {
                child.scale.multiplyScalar(scale);
            });
        }

        model = modelGroup.children.find(c => c.isMesh);
        if (model) {
            const pos = model.geometry.attributes.position;
            const vertCount = pos.count;
            const faceCount = model.geometry.index ? model.geometry.index.count / 3 : vertCount / 3;
            isModelLoaded = true;
            document.getElementById('info-name').textContent = (modelName || 'Модель').substring(0, 18);
            document.getElementById('info-vertices').textContent = vertCount.toLocaleString();
            document.getElementById('info-faces').textContent = Math.round(faceCount).toLocaleString();
            if (textureImage) {
                document.getElementById('info-texture').textContent = '✅';
                document.getElementById('info-texture').className = 'value green';
            }
            document.getElementById('info-status').textContent = '✅ Загружена';
            document.getElementById('info-status').className = 'status success';
            addLog(`✅ ${vertCount} вершин`, 'success');
            selectedIndices = [];
            document.getElementById('info-selected').textContent = '0';
            clearHighlight();
            historyStack = [];
            document.getElementById('bvh-badge').textContent = '⚡ Готов';
        }
    } catch (err) {
        addLog('❌ Ошибка: ' + err.message, 'error');
        console.error(err);
    }
}

function newModel() {
    addLog('🆕 Сброс...', 'info');
    while (modelGroup.children.length > 0) {
        const child = modelGroup.children[0];
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
        modelGroup.remove(child);
    }
    modelGroup.position.set(0, 0, 0);
    model = null;
    objText = null;
    mtlText = null;
    textureImage = null;
    isModelLoaded = false;
    selectedIndices = [];
    historyStack = [];
    modelName = '';
    clearHighlight();
    document.getElementById('info-name').textContent = '—';
    document.getElementById('info-vertices').textContent = '—';
    document.getElementById('info-faces').textContent = '—';
    document.getElementById('info-texture').textContent = '❌';
    document.getElementById('info-texture').className = 'value red';
    document.getElementById('info-mtl').textContent = '❌';
    document.getElementById('info-mtl').className = 'value red';
    document.getElementById('info-selected').textContent = '0';
    document.getElementById('info-speed').textContent = '—';
    document.getElementById('info-status').textContent = '✅ Готов';
    document.getElementById('info-status').className = 'status success';
    addLog('🆕 Загрузите OBJ нового пациента', 'success');
}

function loadTextureFile(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            textureImage = img;
            document.getElementById('info-texture').textContent = '✅';
            document.getElementById('info-texture').className = 'value green';
            addLog('✅ Текстура: ' + img.width + 'x' + img.height, 'success');
            if (model) {
                const texture = new THREE.Texture(img);
                texture.needsUpdate = true;
                texture.colorSpace = THREE.SRGBColorSpace;
                model.material.map = texture;
                model.material.color.setHex(0xffffff);
                model.material.needsUpdate = true;
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function clearHighlight() {
    if (highlightMesh) {
        scene.remove(highlightMesh);
        highlightMesh.geometry.dispose();
        highlightMesh.material.dispose();
        highlightMesh = null;
    }
    if (highlightSphere) {
        scene.remove(highlightSphere);
        highlightSphere.geometry.dispose();
        highlightSphere.material.dispose();
        highlightSphere = null;
    }
}

function selectArea(centerPos, radius) {
    if (!model || !model.geometry) {
        addLog('❌ Загрузите модель!', 'error');
        return;
    }

    const startTime = performance.now();
    const posAttr = model.geometry.attributes.position;
    const count = posAttr.count;

    // Переводим центр в локальные координаты модели
    const localCenter = centerPos.clone();
    localCenter.sub(modelGroup.position);
    // Учитываем scale и позицию дочернего меша
    localCenter.sub(model.position);
    const sx = model.scale.x || 1, sy = model.scale.y || 1, sz = model.scale.z || 1;
    localCenter.x /= sx;
    localCenter.y /= sy;
    localCenter.z /= sz;

    const radiusSq = radius * radius * 0.5; // скорректировано на масштаб
    selectedIndices = [];

    for (let i = 0; i < count; i++) {
        const px = posAttr.getX(i) - localCenter.x;
        const py = posAttr.getY(i) - localCenter.y;
        const pz = posAttr.getZ(i) - localCenter.z;
        const distSq = px*px + py*py + pz*pz;
        if (distSq < radiusSq) {
            selectedIndices.push(i);
        }
    }

    const elapsed = (performance.now() - startTime).toFixed(1);
    document.getElementById('info-selected').textContent = selectedIndices.length;
    document.getElementById('info-speed').textContent = `${elapsed}мс`;

    clearHighlight();

    if (showHighlight && selectedIndices.length > 0) {
        const hlPositions = [];
        const hlColors = [];
        for (const idx of selectedIndices) {
            const v = new THREE.Vector3(posAttr.getX(idx), posAttr.getY(idx), posAttr.getZ(idx));
            v.applyMatrix4(model.matrixWorld);
            hlPositions.push(v.x, v.y, v.z);
            hlColors.push(0.85, 0.65, 0.15);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(hlPositions, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(hlColors, 3));
        const mat = new THREE.PointsMaterial({
            size: 0.028,
            vertexColors: true,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.95
        });
        highlightMesh = new THREE.Points(geo, mat);
        scene.add(highlightMesh);

        const sphereGeo = new THREE.SphereGeometry(brushRadius * 0.3, 16, 16);
        const sphereMat = new THREE.MeshBasicMaterial({
            color: 0xc9a961,
            transparent: true,
            opacity: 0.3,
            wireframe: true
        });
        highlightSphere = new THREE.Mesh(sphereGeo, sphereMat);
        highlightSphere.position.copy(centerPos);
        scene.add(highlightSphere);
    }

    if (selectedIndices.length === 0) {
        document.getElementById('info-status').textContent = '❌ Нет вершин';
        document.getElementById('info-status').className = 'status error';
    } else {
        document.getElementById('info-status').textContent = `✅ ${selectedIndices.length} вершин (${elapsed}мс)`;
        document.getElementById('info-status').className = 'status success';
        addLog(`🎯 ${selectedIndices.length} вершин за ${elapsed}мс`, 'success');
    }
}

function saveToHistory() {
    if (!model || !model.geometry) return;
    const positions = new Float32Array(model.geometry.attributes.position.array);
    historyStack.push({
        positions: positions,
        vertexCount: model.geometry.attributes.position.count
    });
    if (historyStack.length > MAX_HISTORY) historyStack.shift();
    addLog(`💾 История (${historyStack.length}/${MAX_HISTORY})`, 'info');
}

function undo() {
    if (historyStack.length === 0) {
        addLog('⚠️ Нечего отменять', 'warn');
        return;
    }
    const state = historyStack.pop();
    if (state.vertexCount !== model.geometry.attributes.position.count) {
        addLog('⚠️ Нельзя отменить', 'warn');
        return;
    }
    const posAttr = model.geometry.attributes.position;
    posAttr.array.set(state.positions);
    posAttr.needsUpdate = true;
    model.geometry.computeVertexNormals();
    clearSelection();
    document.getElementById('info-status').textContent = `↩️ Отменено (${historyStack.length})`;
    document.getElementById('info-status').className = 'status info';
    addLog(`↩️ Отменено. Осталось: ${historyStack.length}`, 'success');
}

function applySmooth() {
    if (!model || selectedIndices.length === 0) {
        addLog('❌ Выделите область! (режим 🎯)', 'error');
        return;
    }
    saveToHistory();
    addLog(`✨ Сглаживание ${selectedIndices.length}`, 'info');
    document.getElementById('info-status').textContent = '⏳ Сглаживание...';
    document.getElementById('info-status').className = 'status warning';

    setTimeout(() => {
        const startTime = performance.now();
        const pos = model.geometry.attributes.position;
        const index = model.geometry.index;

        // Центр
        const center = new THREE.Vector3();
        for (const idx of selectedIndices) {
            center.add(new THREE.Vector3(pos.getX(idx), pos.getY(idx), pos.getZ(idx)));
        }
        center.divideScalar(selectedIndices.length);

        // MaxDist
        let maxDist = 0;
        for (const idx of selectedIndices) {
            const dx = pos.getX(idx) - center.x;
            const dy = pos.getY(idx) - center.y;
            const dz = pos.getZ(idx) - center.z;
            const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
            if (d > maxDist) maxDist = d;
        }
        if (maxDist === 0) maxDist = brushRadius;

        // Соседи
        const selectedSet = new Set(selectedIndices);
        const neighborMap = new Map();
        if (index) {
            const idxArr = index.array;
            for (let i = 0; i < idxArr.length; i += 3) {
                const a = idxArr[i], b = idxArr[i+1], c = idxArr[i+2];
                if (selectedSet.has(a)) {
                    if (!neighborMap.has(a)) neighborMap.set(a, new Set());
                    neighborMap.get(a).add(b); neighborMap.get(a).add(c);
                }
                if (selectedSet.has(b)) {
                    if (!neighborMap.has(b)) neighborMap.set(b, new Set());
                    neighborMap.get(b).add(a); neighborMap.get(b).add(c);
                }
                if (selectedSet.has(c)) {
                    if (!neighborMap.has(c)) neighborMap.set(c, new Set());
                    neighborMap.get(c).add(a); neighborMap.get(c).add(b);
                }
            }
        }

        const positions = new Map();
        for (const idx of selectedIndices) {
            positions.set(idx, new THREE.Vector3(pos.getX(idx), pos.getY(idx), pos.getZ(idx)));
        }

        for (let iter = 0; iter < smoothIterations; iter++) {
            const newPositions = new Map();
            for (const idx of selectedIndices) {
                const neighbors = neighborMap.get(idx);
                if (!neighbors || neighbors.size === 0) continue;
                const avg = new THREE.Vector3();
                let n = 0;
                neighbors.forEach(ni => {
                    const p = positions.get(ni);
                    if (p) { avg.add(p); n++; }
                });
                if (n === 0) continue;
                avg.divideScalar(n);

                const dist = positions.get(idx).distanceTo(center);
                const df = Math.max(0, 1 - dist / maxDist);
                const ff = Math.pow(df, smoothFalloff / 5);
                const factor = smoothStrength * ff;

                newPositions.set(idx, positions.get(idx).clone().lerp(avg, factor));
            }
            newPositions.forEach((v, k) => positions.set(k, v));
        }

        positions.forEach((v, idx) => pos.setXYZ(idx, v.x, v.y, v.z));
        pos.needsUpdate = true;
        model.geometry.computeVertexNormals();

        const elapsed = (performance.now() - startTime).toFixed(0);
        document.getElementById('info-status').textContent = `✅ Готово за ${elapsed}мс`;
        document.getElementById('info-status').className = 'status success';
        document.getElementById('info-speed').textContent = `${elapsed}мс`;
        addLog(`✅ Сглаживание за ${elapsed}мс`, 'success');
    }, 30);
}

function applyPull() { applyDirectional('pull'); }
function applyPush() { applyDirectional('push'); }
function applyInflate() { applyDirectional('inflate'); }
function applyPinch() { applyDirectional('pinch'); }

function applyDirectional(type) {
    if (!model || selectedIndices.length === 0) {
        addLog('❌ Выделите область!', 'error');
        return;
    }
    saveToHistory();
    const typeNames = { pull: '⬆ Вытягивание', push: '⬇ Вдавливание', inflate: '💨 Надувание', pinch: '🤏 Сужение' };
    const strengths = { pull: 0.015, push: 0.015, inflate: 0.02, pinch: 0.018 };
    addLog(`${typeNames[type]} ${selectedIndices.length}`, 'info');
    document.getElementById('info-status').textContent = `⏳ ${typeNames[type]}...`;
    document.getElementById('info-status').className = 'status warning';

    setTimeout(() => {
        const startTime = performance.now();
        const pos = model.geometry.attributes.position;
        const nor = model.geometry.attributes.normal;
        const strength = strengths[type];
        const fp = smoothFalloff / 5;

        const center = new THREE.Vector3();
        for (const idx of selectedIndices) {
            center.add(new THREE.Vector3(pos.getX(idx), pos.getY(idx), pos.getZ(idx)));
        }
        center.divideScalar(selectedIndices.length);

        const radius = brushRadius * 1.8;

        for (const idx of selectedIndices) {
            const px = pos.getX(idx), py = pos.getY(idx), pz = pos.getZ(idx);
            const dx = px - center.x, dy = py - center.y, dz = pz - center.z;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            if (dist >= radius) continue;

            const df = Math.max(0, 1 - dist / radius);
            const factor = Math.pow(df, 1.5 * fp);
            const nx = nor.getX(idx), ny = nor.getY(idx), nz = nor.getZ(idx);

            if (type === 'pull') {
                pos.setXYZ(idx, px + nx * strength * factor, py + ny * strength * factor, pz + nz * strength * factor);
            } else if (type === 'push') {
                pos.setXYZ(idx, px - nx * strength * factor, py - ny * strength * factor, pz - nz * strength * factor);
            } else if (type === 'inflate') {
                const dirLen = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
                const dirX = dx/dirLen, dirY = dy/dirLen, dirZ = dz/dirLen;
                let cx = dirX + nx * 0.3;
                let cy = dirY + ny * 0.3;
                let cz = dirZ + nz * 0.3;
                const cl = Math.sqrt(cx*cx + cy*cy + cz*cz) || 1;
                cx /= cl; cy /= cl; cz /= cl;
                pos.setXYZ(idx, px + cx * strength * factor, py + cy * strength * factor, pz + cz * strength * factor);
            } else if (type === 'pinch') {
                const dirLen = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
                const dirX = dx/dirLen, dirY = dy/dirLen, dirZ = dz/dirLen;
                pos.setXYZ(idx,
                    px + dirX * (-strength * factor * 0.6) + nx * (strength * factor * 0.3),
                    py + dirY * (-strength * factor * 0.6) + ny * (strength * factor * 0.3),
                    pz + dirZ * (-strength * factor * 0.6) + nz * (strength * factor * 0.3)
                );
            }
        }

        pos.needsUpdate = true;
        model.geometry.computeVertexNormals();

        const elapsed = (performance.now() - startTime).toFixed(0);
        document.getElementById('info-status').textContent = `✅ Готово за ${elapsed}мс`;
        document.getElementById('info-status').className = 'status success';
        document.getElementById('info-speed').textContent = `${elapsed}мс`;
        addLog(`✅ ${typeNames[type]} за ${elapsed}мс`, 'success');
    }, 30);
}

function applyFlatten() {
    if (!model || selectedIndices.length === 0) {
        addLog('❌ Выделите область!', 'error');
        return;
    }
    saveToHistory();
    addLog(`📏 Выравнивание ${selectedIndices.length}`, 'info');
    document.getElementById('info-status').textContent = '⏳ Выравнивание...';
    document.getElementById('info-status').className = 'status warning';

    setTimeout(() => {
        const startTime = performance.now();
        const pos = model.geometry.attributes.position;
        const index = model.geometry.index;
        const selectedSet = new Set(selectedIndices);
        const strength = 0.12;

        if (index) {
            const idxArr = index.array;
            for (let i = 0; i < idxArr.length; i += 3) {
                const a = idxArr[i], b = idxArr[i+1], c = idxArr[i+2];
                if (!selectedSet.has(a) && !selectedSet.has(b) && !selectedSet.has(c)) continue;

                const ax = pos.getX(a), ay = pos.getY(a), az = pos.getZ(a);
                const bx = pos.getX(b), by = pos.getY(b), bz = pos.getZ(b);
                const cx = pos.getX(c), cy = pos.getY(c), cz = pos.getZ(c);

                const mcx = (ax + bx + cx) / 3;
                const mcy = (ay + by + cy) / 3;
                const mcz = (az + bz + cz) / 3;

                const v0x = bx - ax, v0y = by - ay, v0z = bz - az;
                const v1x = cx - ax, v1y = cy - ay, v1z = cz - az;

                let nx = v0y * v1z - v0z * v1y;
                let ny = v0z * v1x - v0x * v1z;
                let nz = v0x * v1y - v0y * v1x;
                const nl = Math.sqrt(nx*nx + ny*ny + nz*nz);
                if (nl < 0.001) continue;
                nx /= nl; ny /= nl; nz /= nl;

                for (const idx of [a, b, c]) {
                    if (!selectedSet.has(idx)) continue;
                    const px = pos.getX(idx) - mcx;
                    const py = pos.getY(idx) - mcy;
                    const pz = pos.getZ(idx) - mcz;
                    const dot = px*nx + py*ny + pz*nz;
                    pos.setXYZ(idx,
                        pos.getX(idx) - dot * nx * strength,
                        pos.getY(idx) - dot * ny * strength,
                        pos.getZ(idx) - dot * nz * strength
                    );
                }
            }
        }

        pos.needsUpdate = true;
        model.geometry.computeVertexNormals();

        const elapsed = (performance.now() - startTime).toFixed(0);
        document.getElementById('info-status').textContent = `✅ Готово за ${elapsed}мс`;
        document.getElementById('info-status').className = 'status success';
        document.getElementById('info-speed').textContent = `${elapsed}мс`;
        addLog(`✅ Выравнивание за ${elapsed}мс`, 'success');
    }, 30);
}

function selectCenter() {
    if (!model) { addLog('❌ Загрузите модель!', 'error'); return; }
    const box = new THREE.Box3().setFromObject(model);
    const center = new THREE.Vector3();
    box.getCenter(center);
    selectArea(center, brushRadius);
}

function selectTop() {
    if (!model) { addLog('❌ Загрузите модель!', 'error'); return; }
    const box = new THREE.Box3().setFromObject(model);
    const center = new THREE.Vector3();
    box.getCenter(center);
    center.y = box.max.y;
    selectArea(center, brushRadius);
}

function selectBottom() {
    if (!model) { addLog('❌ Загрузите модель!', 'error'); return; }
    const box = new THREE.Box3().setFromObject(model);
    const center = new THREE.Vector3();
    box.getCenter(center);
    center.y = box.min.y;
    selectArea(center, brushRadius);
}

function selectRandom() {
    if (!model) { addLog('❌ Загрузите модель!', 'error'); return; }
    const pos = model.geometry.attributes.position;
    const idx = Math.floor(Math.random() * pos.count);
    const v = new THREE.Vector3(pos.getX(idx), pos.getY(idx), pos.getZ(idx));
    v.applyMatrix4(model.matrixWorld);
    selectArea(v, brushRadius);
}

function clearSelection() {
    selectedIndices = [];
    document.getElementById('info-selected').textContent = '0';
    clearHighlight();
    document.getElementById('info-status').textContent = '🧹 Снято';
    document.getElementById('info-status').className = 'status success';
    addLog('🧹 Снято', 'info');
}

    if (model) {
        model.material.wireframe = this.checked;
        model.material.needsUpdate = true;
    }
});

document.getElementById('chk-texture').addEventListener('change', function() {
    if (model && textureImage) {
        if (this.checked) {
            const texture = new THREE.Texture(textureImage);
            texture.needsUpdate = true;
            texture.colorSpace = THREE.SRGBColorSpace;
            model.material.map = texture;
        } else {
            model.material.map = null;
        }
        model.material.needsUpdate = true;
    }
});

    showHighlight = this.checked;
    if (!showHighlight) clearHighlight();
});

// ЗАГРУЗКА ФАЙЛОВ
// ============================================================

document.getElementById('btn-load').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('btn-load-mtl').addEventListener('click', () => document.getElementById('mtl-input').click());
document.getElementById('btn-load-texture').addEventListener('click', () => document.getElementById('texture-input').click());

document.getElementById('file-input').addEventListener('change', function(e) {
    if (this.files.length > 0) {
        const file = this.files[0];
        modelName = file.name;
        addLog(`📂 ${file.name}`, 'info');
        const reader = new FileReader();
        reader.onload = function(ev) {
            objText = ev.target.result;
            addLog('✅ OBJ загружен', 'success');
            loadModel();
        };
        reader.readAsText(file);
    }
    this.value = '';
});

document.getElementById('mtl-input').addEventListener('change', function(e) {
    if (this.files.length > 0) {
        const file = this.files[0];
        addLog(`📄 ${file.name}`, 'info');
        const reader = new FileReader();
        reader.onload = function(ev) {
            mtlText = ev.target.result;
            document.getElementById('info-mtl').textContent = '✅';
            document.getElementById('info-mtl').className = 'value green';
            addLog('✅ MTL загружен', 'success');
            if (objText) loadModel();
        };
        reader.readAsText(file);
    }
    this.value = '';
});

document.getElementById('texture-input').addEventListener('change', function(e) {
    if (this.files.length > 0) {
        const file = this.files[0];
        addLog(`🖼 ${file.name}`, 'info');
        loadTextureFile(file);
    }
    this.value = '';
});

// ============================================================
// ЭКСПОРТ
// ============================================================

document.getElementById('btn-export').addEventListener('click', function() {
    if (!model) { addLog('❌ Нет модели', 'error'); return; }
    const pos = model.geometry.attributes.position;
    let obj = '';
    for (let i = 0; i < pos.count; i++) {
        obj += `v ${pos.getX(i)} ${pos.getY(i)} ${pos.getZ(i)}\n`;
    }
    if (model.geometry.index) {
        const idx = model.geometry.index;
        for (let i = 0; i < idx.count; i += 3) {
            obj += `f ${idx.getX(i)+1} ${idx.getX(i+1)+1} ${idx.getX(i+2)+1}\n`;
        }
    }
    const blob = new Blob([obj], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'model_exported.obj';
    a.click();
    URL.revokeObjectURL(url);
    addLog('💾 Экспортировано', 'success');
});

});
